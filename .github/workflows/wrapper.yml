name: Genera Gradle wrapper (temporaneo)

on:
  push:
    branches: [manutenzione]

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Genera e salva il wrapper
        run: |
          if [ -f gradlew ]; then echo "già presente"; exit 0; fi
          sum=$(curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256)
          gradle wrapper --gradle-version 8.9 --gradle-distribution-sha256-sum "$sum"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git commit -m "Gradle wrapper 8.9"
          git push origin HEAD:manutenzione
