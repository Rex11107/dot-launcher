name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verifica Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepara la chiave di firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dot.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/dot.jks" >> "$GITHUB_ENV"
            echo "::notice::Firma: chiave personale"
          else
            echo "::notice::Firma: chiave temporanea"
          fi

      - name: Compila
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk DotLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DotLauncher
          path: DotLauncher.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dot Launcher 1.0.${{ github.run_number }}
          files: DotLauncher.apk
          make_latest: true
