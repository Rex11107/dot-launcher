name: Build APK

on:
  push:
    branches: [main]
  # build di prova per le pull request: crea l'APK ma non lo rende l'ultima versione
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Prepara la chiave di firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dot.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/dot.jks" >> "$GITHUB_ENV"
            echo "::notice::Firma: chiave personale"
          else
            echo "::notice::Firma: chiave temporanea"
          fi

      - name: Compila
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle assembleRelease --stacktrace 2>&1 | tee build.log; then
            # il motivo dell'errore diventa un'annotazione leggibile senza scaricare i log
            msg=$(grep -E "error:|What went wrong|^e: |Lint found|Error:|\.xml:[0-9]+|FAILED" -A4 build.log | grep -v "^\s*at " | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build fallita::$msg"
            exit 1
          fi

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk DotLauncher.apk

      - uses: actions/upload-artifact@v7
        with:
          name: DotLauncher
          path: DotLauncher.apk

      - uses: softprops/action-gh-release@v3
        if: github.event_name != 'pull_request'
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Dot Launcher 2.0.${{ github.run_number }}
          files: DotLauncher.apk
          make_latest: true

      # Pull request: pre-release di prova con un link diretto. Non è "latest", quindi
      # l'aggiornamento dentro l'app e il link dell'ultima versione non la vedono.
      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'pull_request'
        with:
          tag_name: prova-2.0.${{ github.run_number }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: Prova 2.0.${{ github.run_number }} (PR #${{ github.event.pull_request.number }})
          body: Versione di prova della pull request #${{ github.event.pull_request.number }}, da non usare come aggiornamento.
          files: DotLauncher.apk
          prerelease: true
          make_latest: false

      # Controllo del codice: gira dopo la release, quindi non la ritarda e non la blocca mai
      - name: Android Lint
        if: always()
        continue-on-error: true
        run: |
          gradle lintRelease --continue > lint.log 2>&1 || true
          python3 - <<'EOF'
          import os, collections, xml.etree.ElementTree as ET
          path = "app/build/reports/lint-results-release.xml"
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          if not os.path.exists(path):
              out.write("## Android Lint\n\nRapporto non generato: vedi `lint.log` tra gli artefatti.\n")
              raise SystemExit
          issues = ET.parse(path).getroot().findall("issue")
          by_sev = collections.Counter(i.get("severity") for i in issues)
          by_id = collections.Counter((i.get("severity"), i.get("id"), i.get("category")) for i in issues)
          out.write("## Android Lint\n\n")
          out.write(" · ".join(f"**{n}** {s}" for s, n in by_sev.most_common()) or "Nessun problema", )
          out.write("\n\n| Gravità | Problema | Categoria | Quanti |\n|---|---|---|---|\n")
          order = {"Fatal": 0, "Error": 1, "Warning": 2, "Information": 3}
          for (sev, iid, cat), n in sorted(by_id.items(), key=lambda x: (order.get(x[0][0], 9), -x[1])):
              out.write(f"| {sev} | {iid} | {cat} | {n} |\n")
          out.write("\nIl rapporto completo è nell'artefatto **lint-report**.\n")
          # elenco compatto per le note della build di prova (leggibile anche senza scaricare artefatti)
          with open("lint.md", "w") as md:
              md.write("### Controllo del codice (Android Lint)\n\n")
              md.write(" · ".join(f"**{n}** {s}" for s, n in by_sev.most_common()) or "Nessun problema")
              md.write("\n\n<details><summary>Dettagli</summary>\n\n")
              for i in sorted(issues, key=lambda i: (order.get(i.get("severity"), 9), i.get("id"))):
                  if i.get("severity") not in ("Fatal", "Error", "Warning"):
                      continue
                  loc = i.find("location")
                  f = loc.get("file", "").split("/app/", 1)[-1] if loc is not None else ""
                  line = loc.get("line", "") if loc is not None else ""
                  msg = i.get("message", "").replace("\n", " ").replace("|", "/")[:220]
                  md.write(f"- {i.get('severity')} `{i.get('id')}` {f}:{line} — {msg}\n")
              md.write("\n</details>\n")
          # gli errori veri diventano annotazioni visibili nella pagina della build
          shown = 0
          for i in issues:
              if i.get("severity") in ("Fatal", "Error") and shown < 30:
                  loc = i.find("location")
                  f = loc.get("file", "").split("/app/", 1)[-1] if loc is not None else ""
                  line = loc.get("line", "1") if loc is not None else "1"
                  msg = i.get("message", "").replace("%", "%25").replace("\n", " ")
                  print(f"::warning file=app/{f},line={line},title=Lint {i.get('id')}::{msg}")
                  shown += 1
          EOF

      - name: Controllo del codice nelle note della build di prova
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f lint.md ] || exit 0
          tag="prova-2.0.${{ github.run_number }}"
          { echo "Versione di prova della pull request #${{ github.event.pull_request.number }}, da non usare come aggiornamento."; echo; head -c 120000 lint.md; } > notes.md
          gh release edit "$tag" --notes-file notes.md -R "${{ github.repository }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
            lint.log
          if-no-files-found: ignore
